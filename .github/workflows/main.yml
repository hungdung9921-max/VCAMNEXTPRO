name: Build VCAMNEXTPRO IPA

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Compile & Package IPA
    runs-on: macos-15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Tools (ldid)
        run: brew install ldid

      - name: Compile Swift Source for iOS 16+
        run: |
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          mkdir -p build/VCAMNEXTPRO.app
          
          swiftc -target arm64-apple-ios16.0 \
            -sdk "$SDK_PATH" \
            -O \
            -parse-as-library \
            -emit-executable \
            -o build/VCAMNEXTPRO.app/VCAMNEXTPRO \
            VCAMNEXTPROApp.swift \
            -framework UIKit \
            -framework SwiftUI \
            -framework PhotosUI \
            -framework AVFoundation \
            -framework Network
            
          cp Info.plist build/VCAMNEXTPRO.app/Info.plist
          ldid -SEntitlements.plist build/VCAMNEXTPRO.app/VCAMNEXTPRO

      - name: Package .IPA for TrollStore & ESign
        run: |
          mkdir -p Payload
          cp -r build/VCAMNEXTPRO.app Payload/
          zip -r9 VCAMNEXTPRO.ipa Payload

      - name: Upload .IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VCAMNEXTPRO-IPA
          path: VCAMNEXTPRO.ipa
